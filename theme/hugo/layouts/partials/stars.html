{{/*
  评分画成星，不写「4 星」。

  一屏几十个作品时，五颗星的形状**一眼就能比出高低**，而一行行「4 星」「3 星」
  要逐个读。这是这份存档最常做的动作之一（扫一眼哪些打了高分），值得给它形状。

  没有评分就什么都不画——**不画五颗空星**：那看起来像「打了 0 分」，
  而实测 37% 的电影标记本来就没有评分，那是真实状态不是缺失。

  传进来的是 1–5 的整数。
*/}}
{{ with . }}
<span class="stars" title="{{ . }} 星" aria-label="{{ . }} 星">
  {{- range (seq 5) }}{{ if le . $ }}★{{ else }}<span class="off">★</span>{{ end }}{{ end -}}
</span>
{{ end }}
