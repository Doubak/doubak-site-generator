{{- /*
  正文里的图统一加 `loading="lazy"`。

  首页一页有一百多张封面，广播的月页更多。不加的话浏览器会一次性把它们全取回来
  ——**而这份存档最常见的打开方式是本地双击**，那时「一次性全读」意味着几百次磁盘
  读，第一屏反而更慢。

  alt 原样带过去：生成器写的 alt 是作品名，读屏器要用（见 markdown.js 里封面那一段）。
  没有 alt 的（广播附图、日记内嵌图）保持空 alt——那是「这张图是装饰」的正确说法。
*/ -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}"
  {{- with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
