{{ define "main" }}
<h1>搜索</h1>

{{/*
  ## 索引是 <script> 载进来的，不是 fetch 的

  浏览器在 file:// 下会拦掉 fetch 与 XHR，但 <script> 标签照常工作。
  用 fetch 的话，站点在 http 下能搜、双击打开就废——而「双击 index.html 就能看」
  是这个项目已经守住的性质。

  代价是**拿不到下载进度**：script 标签没有 progress 事件。所以下面那条是
  不确定进度的动画，不是百分比。**宁可不显示进度，也不假装知道。**
*/}}
<div class="searchbox">
  <input id="q" type="search" placeholder="搜自己写过的字…" autocomplete="off"
         autofocus disabled aria-describedby="idxstate">
  <p id="idxstate" class="dim idx idx-loading">
    <span class="bar"><span></span></span>
    正在载入索引…
  </p>
</div>

<p id="stat" class="dim"></p>
<div id="out"></div>

<style>/* 搜索页专用，其余在 site.css */
.searchbox { margin: 1.4rem 0 .6rem; }
#q {
  width: 100%; padding: .6rem .8rem; font: inherit;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 4px;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#q:disabled { opacity: .6; }
.idx { display: flex; align-items: center; gap: .5rem; margin: .5rem 0 0; font-size: .85rem; }
.idx .bar {
  display: none; width: 7rem; height: 3px; border-radius: 2px;
  background: var(--line); overflow: hidden;
}
.idx-loading .bar { display: inline-block; }
.idx-loading .bar span {
  display: block; width: 40%; height: 100%; background: var(--accent);
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.idx-ready::before { content: "✓"; color: var(--accent); font-weight: 600; }
.idx-error::before { content: "⚠"; }
.hit { border-top: 1px solid var(--line); padding: .9rem 0; }
.hit a { text-decoration: none; font-weight: 600; }
.hit .meta { font-size: .82rem; color: var(--dim); margin-top: .15rem; }
.hit .snip { margin-top: .35rem; }
.hit mark { background: var(--accent); color: var(--bg); border-radius: 2px; padding: 0 .1em; }
</style>

<script>
(function () {
  var q = document.getElementById('q');
  var state = document.getElementById('idxstate');
  var stat = document.getElementById('stat');
  var out = document.getElementById('out');
  var rows = null;

  var NAMES = { movie: '影视', book: '书', music: '音乐', game: '游戏', drama: '舞台剧',
                note: '日记', review: '评论' };
  var KIND = { m: '标记', b: '广播', l: '长文', d: '豆列' };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // 高亮命中处。**先转义再插标记**——用户写的字里有尖括号很正常，
  // 顺序反了就是一个 XSS。
  function snippet(text, lq) {
    var i = text.toLowerCase().indexOf(lq);
    if (i < 0) return esc(text.slice(0, 120));
    var from = Math.max(0, i - 40);
    var s = (from > 0 ? '…' : '') + text.slice(from, i + lq.length + 90);
    var j = s.toLowerCase().indexOf(lq);
    return esc(s.slice(0, j)) + '<mark>' + esc(s.slice(j, j + lq.length)) + '</mark>'
      + esc(s.slice(j + lq.length));
  }

  function run() {
    var raw = q.value.trim();
    if (!rows || !raw) { out.innerHTML = ''; stat.textContent = ''; return; }
    var lq = raw.toLowerCase();

    var hits = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var alias = r.a ? r.a.join(' ') : '';
      // 又名与标题同一档：搜「重返沉默之丘」和搜「重返寂静岭」该是一样的。
      var inTitle = (r.n && r.n.toLowerCase().indexOf(lq) >= 0)
        || (alias && alias.toLowerCase().indexOf(lq) >= 0);
      // 导演 / 作者 / 类型这些与正文同一档：搜一个导演的名字该找得到他的片子，
      // 但排在标题命中之后。
      var inBody = (r.c && r.c.toLowerCase().indexOf(lq) >= 0)
        || (r.w && r.w.toLowerCase().indexOf(lq) >= 0);
      // 标题命中排在正文命中前面。rows 生成时已按时间倒序，
      // 稳定排序会把同一档里的顺序保住，所以不必再比日期。
      if (inTitle || inBody) hits.push({ r: r, rank: inTitle ? 0 : 1, inTitle: inTitle });
    }
    hits.sort(function (a, b) { return a.rank - b.rank; });

    // **零结果就说零结果**，不退而给一堆弱相关的东西充数。
    stat.textContent = hits.length ? ('找到 ' + hits.length + ' 条') : '没有找到「' + raw + '」';

    var html = '';
    for (var k = 0; k < Math.min(hits.length, 200); k++) {
      var h = hits[k], d = h.r;
      var title = d.n || (d.t === 'b' ? '广播' : '未知作品');
      var where = KIND[d.t] + (d.k ? ' · ' + (NAMES[d.k] || d.k) : '');
      // 命中的是又名时要把又名显示出来，否则用户会以为搜错了。
      // 命中的是导演/类型这类信息时也要显示出来，理由与又名相同。
      var hitInfo = d.w && d.w.toLowerCase().indexOf(lq) >= 0
        ? '<div class="snip">' + snippet(d.w, lq) + '</div>' : '';
      var hitAlias = d.a && d.a.join(' ').toLowerCase().indexOf(lq) >= 0
        ? '<div class="snip">' + snippet(d.a.join(' / '), lq) + '</div>' : '';
      html += '<div class="hit"><a href="' + esc(d.u) + '.html">' + esc(title) + '</a>'
        + '<div class="meta">' + esc(where) + (d.d ? ' · ' + esc(d.d) : '') + '</div>'
        + hitAlias
        + hitInfo
        + (d.c ? '<div class="snip">' + snippet(d.c, lq) + '</div>' : '')
        + '</div>';
    }
    if (hits.length > 200) html += '<p class="dim">（只显示前 200 条）</p>';
    out.innerHTML = html;
  }

  function ready(n) {
    state.className = 'dim idx idx-ready';
    state.textContent = ' 索引就绪 · ' + n + ' 条';
    q.disabled = false;
    q.focus();
  }

  function failed(why) {
    state.className = 'dim idx idx-error';
    // 说清楚是什么坏了。含糊的「出错了」只会让人以为是自己搜错了。
    state.textContent = ' 索引没载入成功（' + why + '），搜索用不了。';
  }

  var s = document.createElement('script');
  // **裸相对路径**：搜索页与索引都在站点根，所以同级引用在 file://、
  // http://、以及部署在子目录下的三种情况里都成立。写 `/search-index.js`
  // 的话，file:// 会去找文件系统根目录；写 `../` 会跑到站点外面去。
  s.src = 'search-index.js';
  s.onload = function () {
    rows = window.DOUBAK_SEARCH;
    if (!rows) return failed('文件载入了但内容不对');
    ready(rows.length);
    // 支持 /search.html?q=… 直接带查询进来。
    var m = /[?&]q=([^&]*)/.exec(location.search);
    if (m) { q.value = decodeURIComponent(m[1].replace(/\+/g, ' ')); run(); }
  };
  s.onerror = function () { failed('找不到 search-index.js'); };
  document.head.appendChild(s);

  q.addEventListener('input', run);
})();
</script>
{{ end }}
