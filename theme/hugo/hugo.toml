# 一个能直接跑起来的最小 Hugo 站点配置。
#
# 这**不是** Hugo 意义上的 theme（那种要放在 themes/<名字>/ 下、还要在配置里点名）。
# 这里就是站点本身：layouts/ 直接放在站点根下，Hugo 优先用它。少一层间接，
# 也少一件要解释的事。
#
# 换成任何一个现成的 Hugo 主题，只要删掉 layouts/ 再照那个主题的说明配置就行——
# content/ 与 static/ 一个字都不用动。**那才是「交给现成的 SSG」的意思。**

baseURL = '/'

# **让产出可以直接双击打开，不需要任何服务器。**
#
# 默认的绝对路径（`/movie/…`）在 file:// 下全是断的：浏览器会去找文件系统根目录。
# 打开成相对路径之后，实测三个不同深度的页面（首页、作品页、广播月页）断链都是 0。
#
# 这对这份东西格外重要：它要在 2040 年被一个陌生人从一块硬盘上打开，
# 那时候「起一个静态服务器」不该是先决条件。
relativeURLs = true

# **和 relativeURLs 是一套的，缺一不可。**
#
# 默认 Hugo 把每页写成 `book/index.html`，链接指向 `book/`——而浏览器在
# file:// 下打开一个目录，显示的是**目录列表**，不是里面的 index.html。
# 于是站内每一个链接都会掉进一堆编号文件夹里。
#
# uglyURLs 让链接直接指到文件，file:// 下才真的能用。
uglyURLs = true

# Hugo 0.158 起 languageCode 改叫 locale。老版本会忽略不认识的键，所以写新的更安全。
locale = 'zh-cn'
title = '我的豆瓣存档'

# 站点是纯静态的，也**不该**有任何外部请求。这份备份存在的理由就是不再依赖豆瓣，
# 那么它自己也不该去依赖字体 CDN、统计脚本、评论服务。
disableKinds = ['rss', 'sitemap']

[taxonomies]
  # 只留 tags。Hugo 默认还会建 categories，而我们从不写这个键——
  # 于是产出里多出一堆空的分类页，看起来像是有内容而其实没有。
  tag = 'tags'

[pagination]
  # 影视有 2102 条。一页全铺出来就是两千多张图，谁也打不开。
  pagerSize = 48

[markup.goldmark.renderHooks.link]
  # 让 Hugo 把正文里 `../movie/123.md` 这种**指向文件**的链接，解析成它自己那套
  # 固定链接。生成器不该猜 SSG 的 URL 方案——它只说「那份文件在这儿」。
  useEmbedded = "fallback"

[markup.goldmark.renderer]
  # 正文是**用户自己写的字**，原样渲染。豆瓣的短评里有尖括号、颜文字、
  # 半个 HTML 标签都不奇怪，转义掉才是对的。
  unsafe = false

[params]
  # 媒介的中文名。豆瓣的动词跟着媒介走，「看过一本书」是错的说法。
  [params.mediumNames]
    movie = '影视'
    book = '书'
    music = '音乐'
    game = '游戏'
    drama = '舞台剧'
    note = '日记'
    review = '评论'
    broadcast = '广播'
